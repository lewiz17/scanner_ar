<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>


  <script>

    AFRAME.registerComponent('video-target', {
      init: function () {
        const video = document.querySelector("#video");
        const videoPlane = document.querySelector("#video-plane");

        this.el.addEventListener('targetFound', () => {
          // ✅ Trucos magicos que arreglan TODOS los bugs
          video.currentTime = 0; // Volver siempre al primer frame
          video.play(); // Reproducir instantaneamente
          videoPlane.setAttribute("visible", true);
        });

        this.el.addEventListener('targetLost', () => {
          video.pause(); // Pausar para no gastar bateria
          videoPlane.setAttribute("visible", false);
        });
      }
    });
  </script>
  <style>
    body {
      margin: 0;
    }
  </style>
</head>

<body>

  <a-scene mindar-image="imageTargetSrc: /cr7/cr7.mind; showStats: false;" embedded vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- ⚠️ LOS ATRIBUTOS SON OBLIGATORIOS, SIN ESTO NO FUNCIONA EN IOS -->
      <video id="video" src="/cr7/cr7.mp4" loop playsinline webkit-playsinline preload="auto"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity video-target mindar-image-target="targetIndex: 0">

      <a-plane id="video-plane" visible="false" src="#video" position="0 0 0.01" width="1" height="2"></a-plane>

    </a-entity>

  </a-scene>

</body>

</html>
